<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Кабинет бизнеса — TaskLab</title>
  <link rel="stylesheet" href="account.css">
  <script src="client.js" defer></script><script src="business.js" defer></script>
  <style>
    .business-tools{display:flex;align-items:end;gap:18px;margin-bottom:24px}.business-tools .field{flex:1;max-width:540px;margin:0}.business-tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:35px}.business-task{margin:0;display:flex;flex-direction:column;gap:12px}.business-task h3{margin:0;font-size:18px;overflow-wrap:anywhere}.business-task p{margin:0;font-size:13px}.business-task .buttons{margin-top:auto}.business-task[data-open=true]{border-color:var(--accent);box-shadow:0 0 0 2px #23634b20}.comparison{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;align-items:start}.proposal-card{margin:0;min-width:0}.proposal-card h3{overflow-wrap:anywhere;margin-top:0}.proposal-card dl{margin:18px 0}.proposal-card dt{font-weight:700;font-size:12px;margin-top:17px;color:var(--muted)}.proposal-card dd{margin:6px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.proposal-card a{color:var(--accent);overflow-wrap:anywhere}.proposal-card .badge{display:inline-block}.proposal-card .accepted{background:#e0f1e6;color:#23634b}.proposal-card .rejected{background:#f5e6e6;color:#983e3e}.stage-done{background:#edf5e9;border-radius:10px;padding:13px;font-size:13px;color:#23634b}.panel-heading{margin:0 0 15px;overflow-wrap:anywhere}.stage-form .field{margin-top:16px}.stage-form input{max-width:140px}#operation-status{margin-bottom:18px}@media(max-width:620px){.business-tools{align-items:stretch;flex-direction:column}.business-tasks,.comparison{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">◈ TaskLab</a><nav class="nav" aria-label="Навигация"><a href="/">Каталог</a><a href="index.html">Новая задача</a><a href="business.html" aria-current="page">Кабинет бизнеса</a><a href="login.html">Сменить роль</a></nav></header>
  <main>
    <div class="page-heading"><div><span class="eyebrow">КАБИНЕТ БИЗНЕСА</span><h1>Ваши задачи и команды</h1><p>Сравните предложения и выберите, с кем продолжить работу.</p></div></div>
    <div class="business-tools"><div class="field"><label for="company">Компания</label><select id="company"><option value="">Все компании</option></select></div><button id="refresh" type="button" class="secondary">Обновить</button></div>
    <p id="business-error" class="message" role="alert"></p>
    <p id="storage-note" class="hint" role="status"></p>
    <p id="operation-status" class="hint" role="status" aria-live="polite"></p>
    <section aria-labelledby="tasks-heading"><h2 id="tasks-heading">Задачи</h2><p id="task-count" class="hint"></p><div id="task-list" class="business-tasks"></div></section>
    <section id="proposals-panel" aria-labelledby="panel-title" hidden>
      <span class="eyebrow">СРАВНЕНИЕ ПРЕДЛОЖЕНИЙ</span><h2 id="panel-title" class="panel-heading" tabindex="-1"></h2>
      <p>Решение принимает только представитель бизнеса. Можно выбрать одну, несколько или ни одной команды.</p>
      <div id="proposal-list" class="comparison"></div>
    </section>
  </main>
</body>
</html>
