<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Кабинет бизнеса — TaskLab</title>
  <link rel="stylesheet" href="/static/task-builder/account.css"><script src="/static/task-builder/client.js" defer></script><script src="/static/nav.js" defer></script><script src="/static/chat.js" defer></script><script src="/static/task-builder/business.js" defer></script>
<link rel="stylesheet" href="/static/chat.css"></head>
<body>
  <header class="topbar"><a class="brand" href="/">◈ TaskLab</a><nav class="nav" aria-label="Основная навигация"><span class="hint">Загрузка…</span></nav><span id="session-badge" class="session-badge"></span></header>
  <main>
    <div class="page-heading"><div><span class="eyebrow">КАБИНЕТ БИЗНЕСА</span><h1>Мои задачи</h1><p>Задачи вашей компании. Откройте отклики, сравните решения и выберите подходящую команду.</p></div></div>
    <div class="business-tools"><p class="company-label">Компания: <strong id="company-name"></strong></p><button id="refresh" type="button" class="secondary">Обновить</button></div>
    <p id="business-error" class="message" role="alert"></p>
    <p id="operation-status" class="hint" role="status" aria-live="polite"></p>
    <section aria-labelledby="tasks-heading"><h2 id="tasks-heading">Задачи</h2><p id="task-count" class="hint"></p><div id="task-list" class="business-tasks"></div></section>
    <section id="proposals-panel" aria-labelledby="panel-title" hidden>
      <span class="eyebrow">СРАВНЕНИЕ ПРЕДЛОЖЕНИЙ</span><h2 id="panel-title" class="panel-heading" tabindex="-1"></h2>
      <p>Решение принимает только представитель бизнеса. Можно выбрать одну, несколько или ни одной команды.</p>
      <div id="proposal-list" class="comparison"></div>
    </section>
  </main>
</body>
</html>
